<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CairnPoint Holdings Inc.</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: white;
      background: url("cairn-bg.png") no-repeat center center fixed;
      background-size: cover;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.50);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
    }

    .container {
      width: 58%;
      max-width: 920px;
      margin-left: auto;
      margin-right: 5.5%;
      padding-top: 18vh;
      text-align: right;
      text-shadow: 0 2px 7px rgba(0, 0, 0, 0.55);
    }

    h1 {
      font-size: 52px;
      line-height: 1.05;
      letter-spacing: -1px;
      margin: 0 0 18px 0;
      font-weight: 600;
      white-space: nowrap;
    }

    .location {
      font-size: 14px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.82);
      margin-bottom: 52px;
      white-space: nowrap;
    }

    .tagline {
      font-size: 20px;
      line-height: 1.4;
      font-weight: 500;
      margin-bottom: 34px;
      white-space: nowrap;
    }

    .subtext {
      font-size: 15px;
      line-height: 1.5;
      color: rgba(255,255,255,0.82);
      margin-bottom: 70px;
      white-space: nowrap;
    }

    .divider {
      width: 66px;
      height: 1px;
      background: rgba(255,255,255,0.72);
      margin: 0 0 44px auto;
    }

    .contact {
      font-size: 17px;
      margin-bottom: 48px;
    }

    a {
      color: rgba(255,255,255,0.9);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.45);
      padding-bottom: 2px;
    }

    footer {
      font-size: 13px;
      color: rgba(255,255,255,0.55);
    }

    @media (max-width: 900px) {
      .overlay {
        align-items: center;
      }

      .container {
        width: auto;
        margin: 0 auto;
        padding: 40px 24px;
        text-align: center;
      }

      h1 {
        font-size: 34px;
        white-space: normal;
      }

      .location,
      .tagline,
      .subtext {
        white-space: normal;
      }

      .divider {
        margin: 28px auto 36px auto;
      }
    }
  </style>
</head>

<body>
  <div class="overlay">
    <main class="container">
      <h1>CairnPoint Holdings Inc.</h1>

      <div class="location">Calgary, Alberta</div>

      <div class="tagline">
        A privately held Canadian company focused on building long-term value.
      </div>

      <div class="subtext">
        Operating through a disciplined portfolio of businesses, investments, and strategic opportunities.
      </div>

      <div class="divider"></div>

      <p class="contact">Contact: <a href="mailto:info@cairnpoint.ca">info@cairnpoint.ca</a></p>

      <footer>
        © CairnPoint Holdings Inc.
      </footer>
    </main>
  </div>
</body>
</html>
