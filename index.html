<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CairnPoint Holdings Inc.</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: white;
      background: url("cairn-bg.png") no-repeat center center fixed;
      background-size: cover;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.58);
      min-height: 100vh;
      display: flex;
      align-items: center;
    }

    .container {
      max-width: 720px;
      padding: 60px 40px;
      text-align: right;
      margin-left: auto;
      margin-right: 8%;
      transform: translateY(-6%);
    }

    h1 {
      font-size: 48px;
      line-height: 1.05;
      letter-spacing: -1px;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .location {
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #d0d0d0;
      margin-bottom: 32px;
    }

    .tagline {
      font-size: 20px;
      line-height: 1.45;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .subtext {
      font-size: 15px;
      line-height: 1.6;
      color: #d8d8d8;
      margin-bottom: 36px;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: white;
      margin: 30px 0 30px auto;
    }

    a {
      color: #e5e5e5;
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.4);
    }

    a:hover {
      opacity: 0.8;
    }

    footer {
      margin-top: 50px;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
    }

    @media (max-width: 800px) {
      .container {
        margin: 0 auto;
        text-align: center;
        padding: 40px 24px;
        transform: none;
      }

      h1 {
        font-size: 38px;
      }

      .divider {
        margin: 30px auto;
      }
    }
  </style>
</head>

<body>
  <div class="overlay">
    <main class="container">
      <h1>CairnPoint Holdings Inc.</h1>

      <div class="location">Calgary, Alberta</div>

      <div class="tagline">
        A privately held Canadian company focused on building long-term value.
      </div>

      <div class="subtext">
        Operating through a disciplined portfolio of businesses, investments, and strategic opportunities.
      </div>

      <div class="divider"></div>

      <p>Contact: <a href="mailto:info@cairnpoint.ca">info@cairnpoint.ca</a></p>

      <footer>
        © CairnPoint Holdings Inc.
      </footer>
    </main>
  </div>
</body>
</html>
