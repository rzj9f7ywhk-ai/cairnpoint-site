<!DOCTYPE html>
<html>
<head>
  <title>CairnPoint Holdings Inc.</title>
  <style>
  body {
    margin: 0;
    font-family: "Georgia", serif;
    color: white;

    background: url("cairn-bg.png") no-repeat center center fixed;
    background-size: cover;
  }

  .overlay {
    background: rgba(0, 0, 0, 0.6);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .container {
    max-width: 800px;
    padding: 60px 20px;
    text-align: center;
  }

  h1 {
    font-size: 42px;
    margin-bottom: 10px;
  }

  .location {
    font-size: 18px;
    color: #ccc;
    margin-bottom: 40px;
  }

  .tagline {
    font-size: 20px;
    line-height: 1.6;
    margin-bottom: 30px;
  }

  .subtext {
    font-size: 16px;
    color: #ddd;
    margin-bottom: 50px;
  }

  .divider {
    width: 60px;
    height: 2px;
    background: white;
    margin: 40px auto;
  }

  a {
    color: white;
    text-decoration: none;
    border-bottom: 1px solid white;
  }

  footer {
    margin-top: 60px;
    font-size: 14px;
    color: #bbb;
  }
</style>
</head>

<body>
  <div class="overlay">
    <div class="container">

      <h1>CairnPoint Holdings Inc.</h1>
      <div class="location">Calgary, Alberta</div>

      <div class="tagline">
        A privately held company focused on long-term value creation.
      </div>

      <div class="subtext">
        Operating through a portfolio of subsidiary businesses and strategic investments.
      </div>

      <div class="divider"></div>

      <p>Contact: <a href="mailto:info@cairnpoint.ca">info@cairnpoint.ca</a></p>

      <footer>
        © CairnPoint Holdings Inc.
      </footer>

    </div>
  </div>
</body>
</html>
