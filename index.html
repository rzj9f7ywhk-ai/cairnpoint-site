<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CairnPoint Holdings Inc.</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: white;
      background: url("cairn-bg.png") no-repeat center center fixed;
      background-size: cover;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.62);
      min-height: 100vh;
      display: flex;
      align-items: center;
    }

    .container {
      max-width: 900px;
      padding: 60px 40px;
      text-align: right;
      margin-left: auto;
      margin-right: 6%;
      transform: translateY(-10%);
      text-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }

    h1 {
      font-size: 44px;
      line-height: 1.1;
      letter-spacing: -0.8px;
      margin-bottom: 10px;
      font-weight: 600;
      white-space: nowrap;
    }

    .location {
      font-size: 13px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.72);
      margin-bottom: 30px;
      white-space: nowrap;
    }

    .tagline {
      font-size: 20px;
      line-height: 1.5;
      margin-bottom: 18px;
      font-weight: 500;
      white-space: nowrap;
    }

    .subtext {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(255,255,255,0.76);
      margin-bottom: 34px;
      white-space: nowrap;
    }

    .divider {
      width: 50px;
      height: 1px;
      background: rgba(255,255,255,0.6);
      margin: 28px 0 28px auto;
    }

    a {
      color: rgba(255,255,255,0.86);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.35);
      padding-bottom: 1px;
    }

    footer {
      margin-top: 40px;
      font-size: 11px;
      color: rgba(255,255,255,0.45);
    }

    @media (max-width: 900px) {
      .container {
        margin: 0 auto;
        text-align: center;
        padding: 40px 24px;
        transform: none;
      }

      h1 {
        font-size: 34px;
        white-space: normal;
      }

      .tagline,
      .subtext {
        white-space: normal;
      }

      .divider {
        margin: 28px auto;
      }
    }
  </style>
</head>

<body>
  <div class="overlay">
    <main class="container">
      <h1>CairnPoint Holdings Inc.</h1>

      <div class="location">Calgary, Alberta</div>

      <div class="tagline">
        A privately held Canadian company focused on building long-term value.
      </div>

      <div class="subtext">
        Operating through a disciplined portfolio of businesses, investments, and strategic opportunities.
      </div>

      <div class="divider"></div>

      <p>Contact: <a href="mailto:info@cairnpoint.ca">info@cairnpoint.ca</a></p>

      <footer>
        © CairnPoint Holdings Inc.
      </footer>
    </main>
  </div>
</body>
</html>
